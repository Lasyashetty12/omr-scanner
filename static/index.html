<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        OMR Evaluation Dashboard
    </title>

    <link rel="stylesheet" href="/static/style.css">

</head>


<body>

    <header>

        <div class="brand">

            <div class="logo">
                OMR
            </div>

            <div>

                <h1>
                    Manchester Technologies
                </h1>

                <p>
                    Optical Mark Recognition System
                </p>

            </div>

        </div>


        <div class="online">
            ● SCANNER ONLINE
        </div>

    </header>


    <main>

        <!-- ================================================== -->
        <!-- HERO -->
        <!-- ================================================== -->

        <section class="hero">

            <h2>
                OMR Evaluation Dashboard
            </h2>

            <p>
                Scan and evaluate NEET,
                JEE and KCET OMR sheets.
            </p>

        </section>


        <!-- ================================================== -->
        <!-- SCANNER -->
        <!-- ================================================== -->

        <section class="card">

            <h3>
                Scan OMR Sheet
            </h3>


            <!-- EXAM -->

            <label for="exam">
                Exam
            </label>

            <select id="exam">

                <option value="">
                    Select Exam
                </option>

                <option value="neet">
                    NEET
                </option>

                <option value="jee">
                    JEE
                </option>

                <option value="kcet">
                    KCET
                </option>

            </select>


            <!-- ================================================== -->
            <!-- CAMERA -->
            <!-- ================================================== -->

            <div class="scanner-card">

                <button id="openCameraButton" type="button">
                    Open Camera
                </button>


                <!-- CAMERA PREVIEW -->

                <div id="cameraContainer" class="camera-container hidden">

                    <video id="camera" autoplay playsinline muted></video>


                    <!-- OMR GUIDE BOX -->

                    <div class="omr-detection-box">

                        <span class="corner tl"></span>

                        <span class="corner tr"></span>

                        <span class="corner bl"></span>

                        <span class="corner br"></span>


                        <div class="scan-label">
                            OMR SHEET
                        </div>

                    </div>

                </div>


                <!-- Hidden canvas used for capture -->

                <canvas id="captureCanvas" class="hidden"></canvas>


                <!-- Captured image preview -->

                <img id="capturedPreview" class="captured-preview hidden" alt="Captured OMR">


                <!-- CAMERA CONTROLS -->

                <button id="captureButton" type="button" class="hidden">
                    Capture OMR
                </button>


                <button id="retakeButton" type="button" class="hidden">
                    Retake
                </button>


                <button id="scanButton" type="button" class="hidden">
                    Scan & Evaluate
                </button>

            </div>


            <!-- LOADING -->

            <div id="loading" class="hidden">
                Processing OMR...
            </div>


            <!-- ERROR -->

            <div id="error" class="error hidden"></div>

        </section>


        <!-- ================================================== -->
        <!-- RESULT -->
        <!-- ================================================== -->

        <section id="resultSection" class="card hidden">

            <h3>
                Result
            </h3>


            <div class="summary">

                <div class="result-box">

                    <span>
                        Exam
                    </span>

                    <strong id="resultExam">
                        -
                    </strong>

                </div>


                <div class="result-box">

                    <span>
                        Paper / Series
                    </span>

                    <strong id="paperCode">
                        -
                    </strong>

                </div>


                <div class="result-box">

                    <span>
                        Score
                    </span>

                    <strong id="score">
                        -
                    </strong>

                </div>

            </div>


            <div class="summary">

                <div class="result-box">

                    <span>
                        Correct
                    </span>

                    <strong id="correct">
                        -
                    </strong>

                </div>


                <div class="result-box">

                    <span>
                        Wrong
                    </span>

                    <strong id="wrong">
                        -
                    </strong>

                </div>


                <div class="result-box">

                    <span>
                        Blank
                    </span>

                    <strong id="blank">
                        -
                    </strong>

                </div>


                <div class="result-box">

                    <span>
                        Multiple
                    </span>

                    <strong id="multiple">
                        -
                    </strong>

                </div>

            </div>


            <div id="quality"></div>

            <div id="message"></div>

        </section>

    </main>


    <script src="/static/app.js"></script>

</body>

</html>
